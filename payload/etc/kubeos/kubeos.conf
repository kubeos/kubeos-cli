# KubeOS: the node's network ranges.
#
# WHEN   Read by /usr/bin/node-setup, once, just before the node is set up.
#        Afterwards the values that were actually used are recorded in
#        /etc/kubeos/cluster-network.conf, because a live node cannot change
#        them: the pod range is written into every pod IP and into Calico's pool.
# WHY    The ISO is built once and installed on networks nobody knows in
#        advance - home routers on 192.168.1.0/24, offices on 10.0.0.0/8, labs on
#        172.16.0.0/12. If the pod range overlaps the machine's own LAN, Calico
#        treats LAN addresses as pod traffic, does not masquerade them, and pods
#        silently lose DNS, NTP and every LAN service (measured on 2026-11-07:
#        CoreDNS asking 192.168.122.1:53 and getting [UNREPLIED] forever).
# SAFE   Editing this file is the supported override. Nothing here is hidden in
#        the image or in the Calico manifest any more.
#
# auto   Pick the first range that overlaps no network this machine is attached
#        to, and say in the journal which one was chosen. Recommended.
# A CIDR Pin that range instead. It is validated: if it overlaps a local network
#        node-setup refuses to set the node up and names the conflict rather
#        than leaving you a node whose pods cannot reach the LAN.

POD_CIDR=auto
SERVICE_CIDR=auto
